<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Time2Plan</title>

<style>
body{
  font-family: 'Comic Sans MS', cursive;
  margin:0;
  padding:0;
  background:#f4f6fb;
  text-align:center;
}

.page{
  display:none;
  padding:20px;
}

.active{
  display:block;
}

button{
  padding:8px 14px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#6c8cff;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#4f6de6;
}

input, select, textarea{
  padding:6px;
  margin:4px;
  border-radius:6px;
}

.task-item{
  background:white;
  margin:10px auto;
  padding:10px;
  width:70%;
  border-radius:10px;
}

.completed{
  text-decoration:line-through;
  opacity:0.6;
}

table{
  margin:auto;
  border-collapse:collapse;
}

td, th{
  border:1px solid #ccc;
  width:120px;
  height:60px;
  position:relative;
}

.task-block{
  background:#8fd3a6;
  padding:5px;
  border-radius:6px;
  cursor:move;
  font-size:12px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">
  <h1>Time2Plan</h1>
  <button onclick="openPage('tasksPage')">TAREAS</button>
  <button onclick="openPage('schedulePage')">HORARIO</button>
  <button onclick="openPage('notesPage')">NOTAS</button>
  <button onclick="openPage('notificationsPage')">NOTIFICACIONES</button>
</div>

<!-- TAREAS -->
<div id="tasksPage" class="page">
  <h2>Tareas</h2>
  <button onclick="goHome()">Volver</button>

  <h3>Agregar Tarea</h3>

  <input id="tTitle" placeholder="Título"><br>
  <textarea id="tDesc" placeholder="Descripción"></textarea><br>
  <input type="date" id="tDate"><br>

  <input type="number" id="tDays" placeholder="Días necesarios"><br>
  <input type="number" id="tHours" placeholder="Horas por día"><br>

  <select id="tType">
    <option>Escolar</option>
    <option>Personal</option>
  </select><br>

  <select id="tDifficulty">
    <option>Baja</option>
    <option>Media</option>
    <option>Alta</option>
  </select><br>

  <button onclick="addTask()">AGREGAR</button>

  <div id="taskList"></div>
</div>

<!-- HORARIO -->
<div id="schedulePage" class="page">
  <h2>Horario</h2>
  <button onclick="goHome()">Volver</button>

  <h3>Configuración</h3>

  <input id="blockedDays" placeholder="Días ocupados (lunes,martes)"><br>
  <input type="number" id="startHour" placeholder="Hora inicio (ej: 13)"><br>
  <input type="number" id="endHour" placeholder="Hora fin (ej: 18)"><br>

  <button onclick="generateSchedule()">GENERAR HORARIO</button>

  <div id="calendar"></div>
</div>

<!-- NOTAS -->
<div id="notesPage" class="page">
  <h2>Notas</h2>
  <button onclick="goHome()">Volver</button>
  <p>Sección básica de notas (usa tu sistema actual JS).</p>
</div>

<!-- NOTIFICACIONES -->
<div id="notificationsPage" class="page">
  <h2>Notificaciones</h2>
  <button onclick="goHome()">Volver</button>
  <div id="notificationsBox"></div>
</div>

<script src="script.js"></script>
</body>
</html>

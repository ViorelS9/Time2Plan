<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time2Plan</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1 onclick="goHome()">Time2Plan</h1>
</header>

<div id="home" class="page active">
  <div class="grid-home">
    <div class="card" onclick="openPage('tasks')">
      <h2>Tareas</h2>
      <p>Organiza tu trabajo</p>
    </div>

    <div class="card" onclick="openPage('schedule')">
      <h2>Horario</h2>
      <p>Plan semanal inteligente</p>
    </div>

    <div class="card" onclick="openPage('notes')">
      <h2>Notas</h2>
      <p>Cuaderno digital</p>
    </div>
  </div>
</div>

<!-- TAREAS -->
<div id="tasks" class="page">
  <button class="back" onclick="goHome()">← Volver</button>
  <h2>Crear Nueva Tarea</h2>

  <div class="form-card">
    <label>Título</label>
    <input id="taskTitle">

    <label>Descripción</label>
    <textarea id="taskDescription"></textarea>

    <label>Fecha límite</label>
    <input type="date" id="taskDate">

    <label>Días necesarios</label>
    <input type="number" id="taskDays" min="1">

    <label>Horas por día</label>
    <input type="number" id="taskHours" min="1">

    <label>Tipo</label>
    <select id="taskType">
      <option value="escolar">Escolar</option>
      <option value="personal">Personal</option>
    </select>

    <label>Dificultad</label>
    <select id="taskDifficulty">
      <option value="alta">Alta</option>
      <option value="media">Media</option>
      <option value="baja">Baja</option>
    </select>

    <button onclick="addTask()">Agregar Tarea</button>
  </div>

  <h2>Mis Tareas</h2>
  <div id="taskList"></div>
</div>

<!-- HORARIO -->
<div id="schedule" class="page">
  <button class="back" onclick="goHome()">← Volver</button>
  <h2>Generar Horario</h2>

  <div class="form-card">
    <label>Días ocupados (ej: martes,jueves)</label>
    <input id="blockedDays">

    <label>Hora inicio (ej: 8)</label>
    <input type="number" id="startHour">

    <label>Hora fin (ej: 18)</label>
    <input type="number" id="endHour">

    <button onclick="generateSchedule()">Generar Horario</button>
  </div>

  <div id="calendar"></div>
</div>

<!-- NOTAS -->
<div id="notes" class="page">
  <button class="back" onclick="goHome()">← Volver</button>
  <h2>Carpetas</h2>

  <div class="form-card">
    <label>Nombre carpeta</label>
    <input id="folderName">
    <button onclick="createFolder()">Crear</button>
  </div>

  <div id="folders"></div>
</div>

<script src="script.js"></script>
</body>
</html>
